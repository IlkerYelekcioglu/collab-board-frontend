server {
    listen 80;
    server_name localhost;

    # React uygulamasının statik dosyalarını sun
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Sayfa yenilendiğinde 404 hatası vermemesi için (React Router uyumu)
        try_files $uri $uri/ /index.html; 
    }

    # API isteklerini Docker içindeki Backend servisine yönlendir
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket bağlantılarını (Gerçek zamanlı pano için) Backend'e yönlendir
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}